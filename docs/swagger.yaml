swagger: '2.0'
info:
  description: MVP backend for the Weather Tracker service. Implements User Story
    1 (city ranking for trip planning by weather priorities), User Story 2 (windsurfing
    spot and time-slot recommendations), and User Story 3 (outdoor activity time window
    recommendations).
  title: Weather Tracker API
  termsOfService: http://swagger.io/terms/
  contact:
    name: Weather Tracker Team
    email: team@weathertracker.dev
  version: '1.0'
host: localhost:8080
basePath: /
paths:
  /api/v1/auth/login:
    post:
      description: Verifies credentials and returns a Bearer token.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Authenticate and obtain a JWT
      parameters:
      - description: Login credentials
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/handler.credentialsRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handler.authResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/auth/register:
    post:
      description: Creates a user and returns a JWT the React SPA can store.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - auth
      summary: Register a new account
      parameters:
      - description: Registration credentials
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/handler.credentialsRequest'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/handler.authResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/locations/search:
    get:
      description: Geocodes a free-text query and returns candidates with stable IDs.
      produces:
      - application/json
      tags:
      - locations
      summary: Search locations by name
      parameters:
      - type: string
        example: Berlin
        description: City name to search for
        name: q
        in: query
        required: true
      - type: integer
        description: Maximum number of results (default 10)
        name: limit
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handler.locationListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/users/me/locations:
    get:
      security:
      - BearerAuth: []
      description: Returns the authenticated user's comparison list (User Story 1).
      produces:
      - application/json
      tags:
      - users
      summary: List saved locations
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handler.savedLocationListResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
    post:
      security:
      - BearerAuth: []
      description: Adds a city (max 5) to the authenticated user's comparison list.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - users
      summary: Add a location to the comparison list
      parameters:
      - description: Location to save
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/service.AddSavedInput'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/domain.SavedLocation'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '422':
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/users/me/locations/{id}:
    delete:
      security:
      - BearerAuth: []
      description: Deletes a city from the authenticated user's comparison list.
      produces:
      - application/json
      tags:
      - users
      summary: Remove a location from the comparison list
      parameters:
      - type: integer
        description: Location ID
        name: id
        in: path
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/users/me/windsurf-profile:
    get:
      security:
      - BearerAuth: []
      description: Returns the rider's level and target wind range.
      produces:
      - application/json
      tags:
      - windsurf
      summary: Get the windsurf profile
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/domain.WindsurfProfile'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
    put:
      security:
      - BearerAuth: []
      description: Stores the rider's level and acceptable wind speed range.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - windsurf
      summary: Create or update the windsurf profile
      parameters:
      - description: Rider profile
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/service.ProfileInput'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/domain.WindsurfProfile'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/weather/rank:
    post:
      security:
      - BearerAuth: []
      description: Scores up to 5 cities against the traveller's priorities, returns
        them in descending order and highlights the leader. Cities with data older
        than 5 minutes are flagged with isStale=true.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - ranking
      summary: Rank cities by weather priorities
      parameters:
      - description: Cities and ranking criteria
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/service.RankingInput'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/domain.RankingResult'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '422':
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/windsurf/recommendations:
    post:
      security:
      - BearerAuth: []
      description: Analyses the forecast across several spots, accounts for wind direction
        relative to the shore (onshore/offshore/cross-shore) and the rider's level,
        then returns ranked recommendations with reasons. Falls back to saved locations
        when no spots are supplied.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - windsurf
      summary: Recommend a windsurfing spot and time slot
      parameters:
      - description: Recommendation parameters
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/service.RecommendInput'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/domain.RecommendationResult'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
  /api/v1/activity/recommendations:
    post:
      security:
      - BearerAuth: []
      description: Analyses hourly forecast for a city and date, recommending the
        best time windows for outdoor workout or walking.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - activity
      summary: Recommend optimal time windows for outdoor activity
      parameters:
      - description: Activity recommendation criteria
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/service.ActivityInput'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/domain.ActivityRecommendationResult'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '422':
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
definitions:
  domain.CurrentWeather:
    type: object
    properties:
      condition:
        type: string
      feelsLike:
        type: number
      humidity:
        type: integer
      icon:
        type: string
      observedAt:
        type: string
      temperature:
        type: number
      weatherCode:
        type: integer
      windDirection:
        type: number
      windGusts:
        type: number
      windSpeed:
        type: number
  domain.Location:
    type: object
    properties:
      countryCode:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      timezone:
        type: string
  domain.MetricPreference:
    type: object
    properties:
      enabled:
        type: boolean
      ideal:
        type: number
      max:
        type: number
      min:
        type: number
      weight:
        type: number
  domain.MetricScore:
    type: object
    properties:
      metric:
        type: string
      reason:
        type: string
      score:
        type: number
      value:
        type: number
  domain.Orientation:
    type: string
    enum:
    - onshore
    - offshore
    - cross-shore
    - unknown
    x-enum-varnames:
    - OrientationOnshore
    - OrientationOffshore
    - OrientationCrossShore
    - OrientationUnknown
  domain.PrecipitationCriterion:
    type: object
    properties:
      enabled:
        type: boolean
      maxProbability:
        type: number
      weight:
        type: number
  domain.RankedCity:
    type: object
    properties:
      countryCode:
        type: string
      isLeader:
        type: boolean
      isStale:
        type: boolean
      lastUpdated:
        type: string
      latitude:
        type: number
      locationId:
        type: integer
      longitude:
        type: number
      metrics:
        type: array
        items:
          $ref: '#/definitions/domain.MetricScore'
      name:
        type: string
      rank:
        type: integer
      reasons:
        type: array
        items:
          type: string
      score:
        type: number
      weather:
        $ref: '#/definitions/domain.CurrentWeather'
  domain.RankingCriteria:
    type: object
    properties:
      precipitation:
        $ref: '#/definitions/domain.PrecipitationCriterion'
      temperature:
        $ref: '#/definitions/domain.MetricPreference'
      wind:
        $ref: '#/definitions/domain.MetricPreference'
  domain.RankingResult:
    type: object
    properties:
      cities:
        type: array
        items:
          $ref: '#/definitions/domain.RankedCity'
      criteria:
        $ref: '#/definitions/domain.RankingCriteria'
      generatedAt:
        type: string
  domain.Recommendation:
    type: object
    properties:
      averageWindDirection:
        type: number
      averageWindGusts:
        type: number
      averageWindSpeed:
        type: number
      end:
        type: string
      isBest:
        type: boolean
      isStale:
        type: boolean
      latitude:
        type: number
      locationId:
        type: integer
      longitude:
        type: number
      orientation:
        $ref: '#/definitions/domain.Orientation'
      reasons:
        type: array
        items:
          type: string
      score:
        type: number
      spotName:
        type: string
      start:
        type: string
  domain.RecommendationResult:
    type: object
    properties:
      generatedAt:
        type: string
      message:
        type: string
      profile:
        $ref: '#/definitions/domain.WindsurfProfile'
      recommendations:
        type: array
        items:
          $ref: '#/definitions/domain.Recommendation'
  domain.SavedLocation:
    type: object
    properties:
      alias:
        type: string
      countryCode:
        type: string
      displayOrder:
        type: integer
      latitude:
        type: number
      locationId:
        type: integer
      longitude:
        type: number
      name:
        type: string
      savedAt:
        type: string
      shoreNormalDeg:
        type: number
      timezone:
        type: string
  domain.SkillLevel:
    type: string
    enum:
    - beginner
    - intermediate
    - advanced
    - pro
    x-enum-varnames:
    - LevelBeginner
    - LevelIntermediate
    - LevelAdvanced
    - LevelPro
  domain.Spot:
    type: object
    properties:
      latitude:
        type: number
      locationId:
        type: integer
      longitude:
        type: number
      name:
        type: string
      shoreNormalDeg:
        type: number
  domain.WindsurfProfile:
    type: object
    properties:
      level:
        $ref: '#/definitions/domain.SkillLevel'
      updatedAt:
        type: string
      windSpeedMax:
        type: number
      windSpeedMin:
        type: number
  handler.authResponse:
    type: object
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handler.userResponse'
  handler.credentialsRequest:
    type: object
    properties:
      email:
        type: string
        example: rider@example.com
      password:
        type: string
        example: s3cret-passphrase
  handler.errorResponse:
    type: object
    properties:
      error:
        type: string
  handler.locationListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/domain.Location'
  handler.savedLocationListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/domain.SavedLocation'
      limit:
        type: integer
  handler.userResponse:
    type: object
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
  service.AddSavedInput:
    type: object
    properties:
      alias:
        type: string
      countryCode:
        type: string
      latitude:
        type: number
      locationId:
        type: integer
      longitude:
        type: number
      name:
        type: string
      shoreNormalDeg:
        type: number
      timezone:
        type: string
  service.CityInput:
    type: object
    properties:
      countryCode:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
  service.ProfileInput:
    type: object
    properties:
      level:
        $ref: '#/definitions/domain.SkillLevel'
      windSpeedMax:
        type: number
      windSpeedMin:
        type: number
  service.RankingInput:
    type: object
    properties:
      cities:
        type: array
        items:
          $ref: '#/definitions/service.CityInput'
      criteria:
        $ref: '#/definitions/domain.RankingCriteria'
      locationIds:
        type: array
        items:
          type: integer
  service.RecommendInput:
    type: object
    properties:
      days:
        type: integer
      level:
        $ref: '#/definitions/domain.SkillLevel'
      slotHours:
        type: integer
      spots:
        type: array
        items:
          $ref: '#/definitions/domain.Spot'
      windSpeedMax:
        type: number
      windSpeedMin:
        type: number
  domain.ActivityConditions:
    type: object
    properties:
      maxPrecipitationProbability:
        type: number
      maxWindSpeed:
        type: number
      tempMax:
        type: number
      tempMin:
        type: number
  domain.ActivityTimeWindow:
    type: object
    properties:
      averageFeelsLike:
        type: number
      averageTemperature:
        type: number
      averageWindSpeed:
        type: number
      condition:
        type: string
      end:
        type: string
      isBest:
        type: boolean
      matchesConditions:
        type: boolean
      maxPrecipitationProbability:
        type: number
      reasons:
        type: array
        items:
          type: string
      score:
        type: number
      start:
        type: string
      weatherCode:
        type: integer
  domain.ActivityRecommendationResult:
    type: object
    properties:
      activity:
        type: string
      conditions:
        $ref: '#/definitions/domain.ActivityConditions'
      date:
        type: string
      generatedAt:
        type: string
      location:
        $ref: '#/definitions/domain.Location'
      message:
        type: string
      windows:
        type: array
        items:
          $ref: '#/definitions/domain.ActivityTimeWindow'
  service.ActivityInput:
    type: object
    properties:
      activity:
        type: string
      city:
        $ref: '#/definitions/service.CityInput'
      conditions:
        $ref: '#/definitions/domain.ActivityConditions'
      date:
        type: string
      durationHours:
        type: integer
      locationId:
        type: integer
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT returned by /api/v1/auth/login.
    type: apiKey
    name: Authorization
    in: header
